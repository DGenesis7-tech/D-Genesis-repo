name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - appmod/java-upgrade-20260526201830
    paths:
      - portfolio/dGenesisPortfolio/portfolio-site/**
      - .github/workflows/portfolio-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/dGenesisPortfolio/portfolio-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/dGenesisPortfolio/portfolio-site/package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Build static site
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dGenesisPortfolio/portfolio-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4