name: Publish portfolio to gh-pages

on:
  push:
    branches:
      - appmod/java-upgrade-20260526201830
    paths:
      - portfolio/dGenesisPortfolio/portfolio-site/**
      - .github/workflows/portfolio-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/dGenesisPortfolio/portfolio-site/package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci --prefix portfolio/dGenesisPortfolio/portfolio-site || npm install --prefix portfolio/dGenesisPortfolio/portfolio-site --legacy-peer-deps --no-audit --no-fund

      - name: Build static site
        run: npm run build --prefix portfolio/dGenesisPortfolio/portfolio-site
        env:
          GITHUB_ACTIONS: "true"

      - name: Publish to gh-pages
        run: |
          touch portfolio/dGenesisPortfolio/portfolio-site/out/.nojekyll
          temp_dir="$(mktemp -d)"
          cp -R portfolio/dGenesisPortfolio/portfolio-site/out/. "$temp_dir"
          cd "$temp_dir"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy portfolio static site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}