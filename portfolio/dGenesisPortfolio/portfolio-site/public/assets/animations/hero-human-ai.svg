<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Human developer and humanoid software assistant animation</title>
  <desc id="desc">A stylized 2D animated portfolio image with a developer, humanoid software assistant, and floating interface panels.</desc>
  <style>
    .bg{fill:#09090b}.panel{fill:#111827;stroke:#2dd4bf;stroke-opacity:.32;stroke-width:2}.line{stroke:#5eead4;stroke-width:8;stroke-linecap:round}.muted{stroke:#64748b;stroke-width:7;stroke-linecap:round}.skin{fill:#d6a47a}.hair{fill:#18181b}.shirt{fill:#2dd4bf}.dark{fill:#27272a}.bot{fill:#d9f99d}.bot2{fill:#94a3b8}.glow{fill:#2dd4bf;opacity:.22}.cyan{fill:#22d3ee}.float{animation:float 5.5s ease-in-out infinite}.float2{animation:float 6.5s ease-in-out infinite reverse}.pulse{animation:pulse 2.6s ease-in-out infinite}.scan{animation:scan 4s linear infinite}.arm{transform-origin:470px 415px;animation:wave 3.2s ease-in-out infinite}.botarm{transform-origin:742px 410px;animation:botwave 3.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%{transform:translateX(-180px)}100%{transform:translateX(180px)}}@keyframes wave{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(12deg)}}@keyframes botwave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-12deg)}}
  </style>
