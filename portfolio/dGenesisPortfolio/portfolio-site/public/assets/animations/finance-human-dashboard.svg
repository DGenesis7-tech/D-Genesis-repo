  <style>.bg{fill:#09090b}.card{fill:#111827;stroke:#2dd4bf;stroke-opacity:.28;stroke-width:2}.skin{fill:#d6a47a}.shirt{fill:#2dd4bf}.line{stroke:#5eead4;stroke-width:8;stroke-linecap:round}.bar{fill:#2dd4bf}.muted{fill:#334155}.float{animation:float 4.8s ease-in-out infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}.grow{transform-origin:220px 415px;animation:grow 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes grow{0%,100%{transform:scaleX(.45)}50%{transform:scaleX(1)}}</style>
